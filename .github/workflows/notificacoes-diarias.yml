name: Notificações diárias por e-mail (08h Brasília)

on:
  schedule:
    # 11:00 UTC = 08:00 no horário oficial de Brasília (UTC-3)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  disparar-lembretes:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar segredos configurados
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os secrets APP_URL e CRON_SECRET em Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Acordar servidor no Render (plano gratuito)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          BASE_URL="${APP_URL%/}"
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 "${BASE_URL}/api/health" > /dev/null
          echo "Servidor acordado e saudável."

      - name: Executar rotina diária de notificações
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE_URL="${APP_URL%/}"
          curl -fsS --fail-with-body --retry 2 --retry-delay 10 --max-time 60 \
            -X POST "${BASE_URL}/api/cron/notificacoes" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}"
          echo ""
